<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de Proyectos de Investigación v16</title><style>
:root{--bg:#f4f6fa;--ink:#17243b;--muted:#66758d;--primary:#234e83;--line:#dfe5ee;--white:#fff;--green:#13795b;--amber:#9b6500;--red:#a73545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#175ba3;word-break:break-word}header{background:#132c4d;color:white;padding:17px 26px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{color:#bfd0e7}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 10px}aside button{display:block;width:100%;padding:10px 12px;margin:2px 0;text-align:left;background:transparent;border:0;border-radius:9px;color:#34445e}aside button.active{background:#e7effa;color:#164679;font-weight:700}main{padding:24px;max-width:1470px;width:100%;margin:auto}h2{font-size:25px;margin:0 0 6px}h3{font-size:17px;margin:0 0 12px}h4{margin:0 0 9px}.muted{color:var(--muted)}.intro{margin:0 0 20px;color:var(--muted)}.card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:19px;margin:0 0 17px;box-shadow:0 2px 7px #213a5b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:5px;margin:0 0 11px}.field>span{font-size:12px;color:#435570;font-weight:650}input,textarea,select{width:100%;border:1px solid #ced7e3;background:#fff;color:var(--ink);border-radius:8px;padding:9px;min-width:0}textarea{min-height:77px;resize:vertical}input[type=checkbox]{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.btn{border:1px solid #d0d9e6;background:white;border-radius:8px;padding:9px 12px;color:#234264}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:var(--red)}.btn.small{padding:5px 9px;font-size:12px}.chip{display:inline-block;border-radius:99px;background:#edf1f8;color:#445570;padding:3px 9px;font-size:12px;margin:2px}.chip.good{background:#dff5e9;color:#08633c}.chip.warn{background:#fff1d6;color:#855b00}.chip.bad{background:#fce8eb;color:#9b2940}.record{border:1px solid var(--line);border-radius:10px;padding:13px;margin:10px 0;background:#fff}.record-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.record p{margin:6px 0}.kpi{border:1px solid var(--line);border-radius:12px;background:#fff;padding:17px}.kpi strong{font-size:23px;display:block}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}.tabs button{padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:#fff}.tabs button.active{background:#234e83;color:#fff}.bar{background:#edf1f6;border-radius:10px;overflow:hidden;height:9px;margin:10px 0}.bar div{background:#298c71;height:100%}.formbox{border:1px dashed #bccada;border-radius:11px;padding:17px;background:#f8fbff;margin:14px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}td,th{border-bottom:1px solid var(--line);text-align:left;padding:9px;vertical-align:top}th{color:#415575;font-size:12px;background:#f5f8fc}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.notice{border-left:3px solid #d9a441;background:#fff8e9;padding:11px 13px;margin:12px 0}.empty{padding:22px;border:1px dashed #d2dbe7;border-radius:9px;color:var(--muted)}.search{max-width:320px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#657d9e}.print-only{display:none}@media(max-width:780px){.shell{display:block}aside{display:flex;overflow:auto;gap:4px;padding:8px;position:sticky;top:0;z-index:3}aside button{white-space:nowrap;width:auto}main{padding:14px}.two{grid-template-columns:1fr}header{padding:14px}}@media print{header,aside,.no-print,.btn,.tabs,.formbox{display:none!important}.shell{display:block}main{padding:0}.card,.record{box-shadow:none;break-inside:avoid}.print-only{display:block}body{background:#fff}}

.project-overlay{position:fixed;inset:0;background:rgba(10,24,43,.62);display:flex;align-items:center;justify-content:center;padding:22px;z-index:9999}.project-dialog{background:white;color:#17243b;width:min(620px,100%);max-height:90vh;overflow:auto;padding:26px;border-radius:15px;box-shadow:0 18px 60px #0004}.project-dialog h2{margin:0 0 7px}.project-dialog .actions{margin-top:18px}.project-dialog input{width:100%}
.formbox[data-entry-form]{display:none}.entry-dialog form{display:block!important}.entry-dialog{width:min(820px,100%)}.entry-dialog .formbox{box-shadow:none} .selector-cards{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.selector-cards button{border:1px solid #cbd6e7;background:white;color:#234e83;border-radius:12px;padding:12px 17px;cursor:pointer;font-weight:650}.selector-cards button.active{background:#234e83;color:white;border-color:#234e83}.selector-cards button:disabled{opacity:.5;cursor:not-allowed}.quota-matrix{overflow:auto}.quota-matrix table input{width:95px;max-width:100%;padding:7px}.quota-matrix th,.quota-matrix td{text-align:center;min-width:115px}.smallhelp{font-size:12px;color:#66758d}.person-cards{display:flex;flex-wrap:wrap;gap:8px}.person-cards label{padding:8px 12px;border:1px solid #ced8e6;border-radius:12px;background:white;cursor:pointer}.person-cards label:has(input:checked){background:#e0ecfd;border-color:#234e83}.person-cards input{width:auto}.subtle{background:#f4f7fb;border:1px solid #e1e7f0;border-radius:10px;padding:12px;margin:8px 0}.sample-slot-table td{min-width:190px;vertical-align:top}.slot-boxes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.slot{border:1px solid #bec9d8;border-radius:8px;padding:7px 9px;background:#edf1f6;color:#364456;font-weight:750;text-align:center;cursor:pointer;min-width:80px}.slot small{display:block;font-size:10px;font-weight:500}.slot.listo{background:#d8f4e5;border-color:#82cda7;color:#0a6140}.slot.proceso{background:#fff0c8;border-color:#e9bd68;color:#845000}.slot.sin{background:#eef1f6;color:#5f6d7d}</style></head><body><header><div><h1>Gestor de Proyectos de Investigación</h1><small id="projectLabel">Proyecto sin nombre</small></div><div class="row"><span id="saveState">Cambios guardados en este navegador</span><button class="btn primary" onclick="newProject()">+ Nuevo proyecto</button><button class="btn" onclick="exportJSON()">Exportar JSON</button><button class="btn" onclick="document.getElementById('fileImport').click()">Importar JSON</button><input id="fileImport" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"></div></header><div class="shell"><aside id="sidebar"></aside><main id="app"></main></div>
<script>
'use strict';
const KEY='gestor-investigacion-v1';const nav=[['inicio','Inicio'],['proyecto','Proyecto'],['equipo','Equipo'],['bitacora','Bitácora'],['reuniones','Reuniones y tareas'],['presupuesto','Presupuesto'],['muestras','Muestras'],['productos','Productos'],['vcm','VCM y difusión'],['documentos','Gestor documental'],['descargables','Descargables']];
const blank=()=>({version:1,id:uid(),project:{name:'',code:'',start:'',end:'',description:'',goals:[],years:[]},team:[],log:[],meetings:[],tasks:[],budget:[],budgetItems:[],expenseTypes:[],samples:[],sampleCheck:['Grabación','Ficha','Consentimiento 1','Consentimiento 2','Primera transcripción','Segunda transcripción','Revisión final'],products:[],vcm:[],links:[],notes:[],downloads:[],refunds:[],budgetConfigured:{},sampleGroups:[]});
function uid(){return 'id_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36)}
function load(){try{let p=JSON.parse(localStorage.getItem(KEY));return p&&p.project&&p.team?p:blank()}catch{return blank()}}
let db=load();db.budgetConfigured??={};db.sampleGroups??=[];db.budget.forEach(g=>{g.subitems??=[];g.expenses??=[]});if(db.samples.some(s=>!s.groupId)){let oldGroup={id:'legacy_samples',name:'Muestras anteriores',prefix:'MUE',kind:'lista',categories:[],rows:[],cols:[],targets:{},nextNumber:1};if(!db.sampleGroups.some(x=>x.id===oldGroup.id))db.sampleGroups.unshift(oldGroup);db.samples.forEach(s=>{if(!s.groupId){s.groupId=oldGroup.id;if(!s.code)s.code='MUE-'+String(oldGroup.nextNumber++).padStart(3,'0')}})}for(let g of db.budget)if((g.expenses||[]).length)db.budgetConfigured[g.year]=true;let projectReady=Boolean(db.project?.name||db.project?.code||db.initialized),section='inicio',sub={},editing=null,filter='todos',expanded=null;
let editingYearId=null;
function normalizeProjectYears(){
  if(!Array.isArray(db.project.years))db.project.years=[];
  const seen=new Set();
  db.project.years.forEach((y,i)=>{
    if(!y || typeof y!=='object')return;
    let old=y.id;
    if(!old || seen.has(String(old))){
      y.id=uid();
      // Legacy projects with missing IDs cannot reliably associate an existing budget to an individual year.
      // Preserve the budget records rather than deleting or reassigning them automatically.
    }
    seen.add(String(y.id));
    if(!y.name)y.name='Año '+(i+1);
  });
}
normalizeProjectYears();
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(+n||0);const num=n=>Number(n)||0;const text=s=>esc(s).replace(/\n/g,'<br>');const dt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-CL'):'Sin fecha';const yearOf=date=>db.project.years.find(y=>date&&date>=y.start&&date<=y.end)?.id||'';const yn=id=>db.project.years.find(y=>y.id===id)?.name||'Sin año asignado';const tn=id=>db.team.find(x=>x.id===id)?.name||'Sin responsable';const goalName=id=>db.project.goals.flatMap(g=>g.specific||[]).find(x=>x.id===id)?.title||'Sin objetivo específico';const link=(url,label)=>url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label||url)+'</a>':'—';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('saveState').textContent='Guardado local · '+new Date().toLocaleTimeString('es-CL');$('projectLabel').textContent=db.project.name||'Proyecto sin nombre'}catch(e){alert('No se pudo guardar localmente. Exporte el JSON para conservar los cambios. '+e.message)}}
function welcome(){return `<div class="card" style="max-width:770px;margin:35px auto;padding:30px"><h2>Comenzar un proyecto</h2><p class="intro">Cree un nuevo proyecto para habilitar todos los módulos de gestión, o importe un respaldo JSON existente.</p><form onsubmit="event.preventDefault();createProject(this)"><h3>Nuevo proyecto de investigación</h3><div class="grid">${field('Nombre del proyecto','name')}${field('Código del proyecto','code')}${field('Fecha de inicio','start','','date')}${field('Fecha de término','end','','date')}</div><button class="btn primary" type="submit">Crear proyecto y habilitar módulos</button></form><div class="actions" style="margin-top:20px"><button class="btn" onclick="document.getElementById('fileImport').click()">Importar proyecto desde JSON</button></div><p class="muted">Los cambios se guardan en este navegador. Exporte periódicamente el JSON para mantener un respaldo.</p></div>`}
function createProject(f){let d=formData(f);if(!d.name?.trim())return alert('Ingrese el nombre del proyecto.');if(d.start&&d.end&&d.end<d.start)return alert('Revise las fechas del proyecto.');db=blank();db.project={...db.project,...d,name:d.name.trim()};db.initialized=true;projectReady=true;section='proyecto';sub={};editing=null;expanded=null;refresh()}
function newProject(){
  document.getElementById('newProjectOverlay')?.remove();
  const overlay=document.createElement('div');overlay.className='project-overlay';overlay.id='newProjectOverlay';
  overlay.innerHTML=`<div class="project-dialog" role="dialog" aria-modal="true" aria-label="Crear nuevo proyecto"><div class="row" style="justify-content:space-between"><h2>Crear nuevo proyecto</h2><button type="button" class="btn" onclick="closeNewProject()">Cerrar ×</button></div><p class="intro">Complete los datos para crear el proyecto y habilitar todos los módulos.</p>${projectReady?'<div class="notice"><b>Ya existe un proyecto activo.</b> Antes de continuar, exporte su JSON: al crear uno nuevo se reemplazará el proyecto activo en este navegador.</div><div class="actions"><button type="button" class="btn" onclick="exportJSON()">Descargar respaldo JSON</button></div>':''}<form id="newProjectForm" onsubmit="event.preventDefault();submitNewProject(this)"><div class="grid">${field('Nombre del proyecto','name')}${field('Código del proyecto','code')}${field('Fecha de inicio','start','','date')}${field('Fecha de término','end','','date')}</div>${projectReady?'<label class="field" style="margin-top:12px"><span><input type="checkbox" name="ack" required style="width:auto"> Confirmo que deseo reemplazar el proyecto activo (dispongo de un respaldo si quiero conservarlo).</span></label>':''}<div class="actions"><button type="submit" class="btn primary">Crear proyecto y habilitar módulos</button><button type="button" class="btn" onclick="closeNewProject()">Cancelar</button></div></form></div>`;
  document.body.appendChild(overlay);overlay.querySelector('[name="name"]').focus();
}
function closeNewProject(){document.getElementById('newProjectOverlay')?.remove()}
function submitNewProject(form){if(projectReady&&!form.elements.namedItem('ack')?.checked)return alert('Confirme que desea reemplazar el proyecto actual.');createProject(form);if(projectReady)closeNewProject()}

function render(){document.getElementById('entryDialog')?.remove();let menu=$('sidebar');if(!projectReady){menu.innerHTML='<div class="notice">Cree o importe un proyecto para habilitar los módulos.</div>';$('projectLabel').textContent='Sin proyecto activo';$('app').innerHTML=welcome();return;}menu.innerHTML=nav.map(([id,name])=>`<button class="${id===section?'active':''}" onclick="go('${id}')">${esc(name)}</button>`).join('');$('projectLabel').textContent=db.project.name||'Proyecto sin nombre';$('app').innerHTML=({inicio:home,proyecto:project,equipo:team,bitacora:logView,reuniones:meetingsView,presupuesto:budgetView,muestras:samplesView,productos:productsView,vcm:vcmView,documentos:docsView,descargables:downloadsView}[section])();}function go(s){if(!projectReady)return render();section=s;editing=null;expanded=null;render();window.scrollTo(0,0)}function refresh(){save();render()}
function field(label,key,value='',type='text',opts=null){return `<label class="field"><span>${esc(label)}</span>${type==='textarea'?`<textarea name="${key}">${esc(value)}</textarea>`:type==='select'?`<select name="${key}">${(opts||[]).map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}>`}</label>`}
const inp=(name,form)=>form.elements.namedItem(name)?.value??'';const formData=form=>Object.fromEntries(new FormData(form).entries());const btn=(label,fn,cl='')=>`<button type="button" class="btn ${cl}" onclick="${fn}">${label}</button>`;const moduleTop=(title,desc)=>`<h2>${title}</h2><p class="intro">${desc}</p>`;const empty=t=>`<div class="empty">${t}</div>`;const addForm=(id,title,content,handler)=>`<form class="formbox" data-entry-form="${handler}" onsubmit="event.preventDefault();${handler}(this)"><h3>${title}</h3>${content}<div class="actions"><button class="btn primary" type="submit">Guardar</button>${btn('Cancelar','cancelEdit()')}</div></form>`;function cancelEdit(){editingYearId=null;editing=null;if(section==='productos')sub.products='visualizar';if(section==='vcm')sub.vcm='visualizar';closeEntryDialog();render()}
function closeEntryDialog(){document.getElementById('entryDialog')?.remove()}
function openEntryForm(handler){
 closeEntryDialog();
 let forms=[...document.querySelectorAll('#app form[data-entry-form]')];
 let form=forms.find(f=>!handler||f.dataset.entryForm===handler);
 if(!form)return false;
 const heading=form.querySelector('h3')?.textContent||({'saveMeeting':'Reunión','saveTask':'Tarea','saveProduct':'Producto','saveVCM':'Actividad','saveSampleEntry':'Muestra'})[handler]||'Nuevo registro';
 const overlay=document.createElement('div');overlay.className='project-overlay';overlay.id='entryDialog';
 const dialog=document.createElement('div');dialog.className='project-dialog entry-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');
 const top=document.createElement('div');top.className='row';top.style.justifyContent='space-between';const label=document.createElement('h2');label.textContent=editing?'Editar · '+heading:heading;top.appendChild(label);
 const close=document.createElement('button');close.type='button';close.className='btn';close.textContent='Cerrar ×';close.onclick=()=>cancelEdit();top.appendChild(close);dialog.appendChild(top);
 const parent=form.parentElement;const placeholder=document.createElement('span');placeholder.style.display='none';parent.insertBefore(placeholder,form);form.classList.remove('formbox');form.style.display='block';dialog.appendChild(form);overlay.appendChild(dialog);document.body.appendChild(overlay);
 overlay.addEventListener('click',e=>{if(e.target===overlay)cancelEdit()});form.querySelector('input:not([type=hidden]),textarea,select')?.focus();return true;
}
function entryAction(handler,label){return `<button type="button" class="btn primary" onclick="${handler==='saveProduct'?"sub.products='agregar';editing=null;render();openEntryForm('saveProduct')":handler==='saveVCM'?"sub.vcm='agregar';editing=null;render();openEntryForm('saveVCM')":`editing=null;render();openEntryForm('${handler}')`}">＋ ${label}</button>`}
function edit(kind,id){if(kind==='budget'){editing={kind,id};sub.budgetTab='config';render();openEntryForm('saveGlosa');return;}editing={kind,id};if(kind==='samples'){let sm=db.samples.find(x=>x.id===id);if(sm?.groupId)sub.sampleGroup=sm.groupId;}if(kind==='products')sub.products='agregar';if(kind==='vcm')sub.vcm='agregar';render();setTimeout(()=>{let handlers={meetings:'saveMeeting',tasks:'saveTask',products:'saveProduct',vcm:'saveVCM',team:'saveTeam',log:'saveLog',downloads:'saveDownload',samples:'saveSampleEntry',budget:'saveGlosa',expenseTypes:'saveExpenseType',expense:'saveExpense'};if(handlers[kind])openEntryForm(handlers[kind])},0)}function erase(kind,id){if(!confirm('¿Eliminar este registro? La eliminación se guardará en el JSON.'))return;db[kind]=db[kind].filter(x=>x.id!==id);refresh()}function controls(kind,id){return `<div class="actions">${btn('Editar',`edit('${kind}','${id}')`,'small')}${btn('Eliminar',`erase('${kind}','${id}')`,'small danger')}</div>`}function target(kind){return editing?.kind===kind?db[kind].find(x=>x.id===editing.id):null}function upsert(kind,form,transform){let item=transform(formData(form));if(editing?.kind===kind&&target(kind)){Object.assign(target(kind),item)}else db[kind].push({id:uid(),...item});editing=null;refresh()}function tabs(name,items){let selected=sub[name]||items[0][0];return `<div class="tabs no-print">${items.map(([id,label])=>`<button class="${id===selected?'active':''}" onclick="sub['${name}']='${id}';editing=null;render()">${label}</button>`).join('')}</div>`}function teamOpts(value='',multiple=false){return `<select name="${multiple?'person':''}" ${multiple?'multiple size="5"':''}><option value="">Sin asignar</option>${db.team.map(x=>`<option value="${x.id}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}function objectiveOpts(value=''){return `<select name="goal"><option value="">Sin asignar</option>${db.project.goals.flatMap(g=>(g.specific||[]).map(s=>`<option value="${s.id}" ${s.i function budgetTotals(y){let gs=db.budget.filter(g=>g.year===y);let a=gs.reduce((s,g)=>s+num(g.amount),0),spent=gs.reduce((s,g)=>s+glosaTotals(g).spent,0),projected=gs.reduce((s,g)=>s+glosaTotals(g).projected,0);return{assigned:a,spent,projected,available:a-spent-projected}}function glosaTotals(g){let spent=0,projected=0;(g.expenses||[]).forEach(e=>{if(e.installments?.length){e.installments.forEach(t=>{if(t.paid)spent+=num(t.amount);else projected+=num(t.amount)})}else if(e.paid)spent+=num(e.amount);else projected+=num(e.amount)});return{spent,projected,available:num(g.amount)-spent-projected}}function expenseTypeForm(x){return addForm('','Tipo de gasto',field('Categoría','name',x?.name)+field('Documentos exigidos (uno por línea)','docsText',x?.docs?.join('\n'),'textarea')+`<label class="row" style="padding:12px"><input type="checkbox" name="requiresProductEvidence" ${x?.requiresProductEvidence?'checked':''}> <b>Exigir evidencia de un producto académico (código P)</b></label><p class="smallhelp">Se podrá vincular un documento de Productos o consignar uno externo. Esta evidencia no recibirá un código G.</p>`,'saveExpenseType')}function saveExpenseType(f){upsert('expenseTypes',f,d=>({name:d.name,docs:jsonList(d.docsText),requiresProductEvidence:!!f.elements.namedItem('requiresProductEvidence')?.checked}))}function glosaForm(g,y){return addForm('','Ítem presupuestario',field('Nombre','name',g?.name)+field('Monto total CLP','amount',g?.amount||0,'number'),'saveGlosa')}function saveGlosa(f){let d=formData(f),y=sub.budgetYear||db.project.years[0]?.id;if(editing?.kind==='budget'&&editing.id!=='new')Object.assign(db.budget.find(g=>g.id===editing.id),d);else db.budget.push({id:uid(),year:y,...d,expenses:[],moves:[]});editing=null;refresh()}function moveGlosa(id,dir){let y=db.budget.find(x=>x.id===id).year,ids=db.budget.map((g,i)=>g.year===y?i:null).filter(x=>x!==null),idx=db.budget.findIndex(x=>x.id===id),pos=ids.indexOf(idx),targetIdx=ids[pos+dir];if(targetIdx!==undefined&& function ensureQuotaSlots(g){
 if(g.kind!=='cuotas')return;
 g.slots??=[];g.targets??={};

function createSampleGroup(f){let d=formData(f);if(!d.name.trim())return alert('Ingrese un nombre.');let g={id:uid(),name:d.name.trim(),prefix:(d.prefix||'MUE').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'')||'MUE',kind:d.kind,categories:[],rows:[],cols:[],targets:{},nextNumber:1};db.sampleGroups.push(g);sub.sampleGroup=g.id;sub.sampleCreate=false;refresh()}
function deleteSampleGroup(id){if(db.samples.some(x=>x.groupId===id))return alert('Este conjunto tiene muestras. Elimine o reasigne las muestras antes de borrar el conjunto.');if(!confirm('¿Eliminar este conjunto?'))return;db.sampleGroups=db.sampleGroups.filter(x=>x.id!==id);sub.sampleGroup='';refresh()}
function categoryPath(g,c){if(!c)return '';let names=[c.name],visited=new Set([c.id]);while(c.parent&&!visited.has(c.parent)){c=g.categories.find(x=>x.id===c.parent);if(!c)break;visited.add(c.id);names.unshift(c.name)}return names.join(' → ')}
function sampleHierarchy(g){return `<div class="card"><h3>Árbol de categorías</h3><p>Puede crear tantas subcategorías y niveles como necesite.</p>${(g.categories||[]).map(c=>`<div class="record"><b>${esc(categoryPath(g,c))}</b> ${btn('Eliminar',`deleteSampleCategory('${g.id}','${c.id}')`,'small danger')}</div>`).join('')||empty('Sin categorías: los registros pueden agregarse directamente al conjunto.')}<form onsubmit="event.preventDefault();addSampleCategory('${g.id}',this)"><div class="grid">${field('Nombre de subcategoría','name')}<label class="field"><span>Depende de</span><select name="parent"><option value="">Categoría raíz</option>${(g.categories||[]).map(c=>`<option value="${c.id}">${esc(categoryPath(g,c))}</option>`).join('')}</select></label></div><button class="btn primary">Agregar subcategoría</button></form></div>`}
function addSampleCategory(id,f){let g=db.sampleGroups.find(g=>g.id===id),d=formData(f);if(!d.name.trim())return;g.categories.push({id:uid(),name:d.name.trim(),parent:d.parent});refresh()}
function deleteSampleCategory(id,cid){let g=db.sampleGroups.find(g=>g.id===id);if(db.samples.some(s=>s.category===cid)||g.categories.some(c=>c.parent===cid))return alert('Categoría en uso o con subcategorías.');g.categories=g.categories.filter(c=>c.id!==cid);refresh()}
function sampleMatrix(g){let rows=g.rows||[],cols=g.cols||[];return `<div class="card"><h3>Configurar matriz de cuotas</h3><form onsubmit="event.preventDefault();saveSampleMatrix('${g.id}',this)"><div class="grid">${field('Variable para filas (ej.: Grupo etario)','rowTitle',g.rowTitle||'Grupo etario')}${field('Categorías de filas (una por línea)','rowText',rows.join('\n'),'textarea')}${field('Variable para columnas (ej.: Sexo)','colTitle',g.colTitle||'Sexo')}${field('Categorías de columnas (una por línea)','colText',cols.join('\n'),'textarea')}</div><button class="btn primary">Guardar estructura de la matriz</button></form>${rows.length&&cols.length?`<h3>Objetivos y avances por celda</h3><form class="quota-matrix" onsubmit="event.preventDefault();saveQuotaTargets('${g.id}',this)"><table><thead><tr><th>${esc(g.rowTitle||'Filas')} / ${esc(g.colTitle||'Columnas')}</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th>${esc(r)}</th>${cols.map(c=>{let key=r+'||'+c,target=num(g.targets?.[key]),collected=db.samples.filter(s=>s.groupId===g.id&&s.cell===key).length,ready=db.samples.filter(s=>s.groupId===g.id&&s.cell===key&&sampleReady(s)).length;return `<td><label class="smallhelp">Meta <input type="number" min="0" name="${esc(key)}" value="${target}"></label><div><b>${collected}</b> / ${target}</div><div class="smallhelp">${ready} listos · ${Math.max(0,target-collected)} faltantes</div></td>`}).join('')}</tr>`).join('')}</tbody></table><button class="btn primary">Guardar metas de cuotas</button></form>`:'<div class="notice">Configure al menos una categoría para cada variable.</div>'}</div>`}
function saveSampleMatrix(id,f){let g=db.sampleGroups.find(x=>x.id===id),d=formData(f);let rows=jsonList(d.rowText),cols=jsonList(d.colText);if(db.samples.some(s=>s.groupId===id&&!rows.concat().some(r=>cols.some(c=>s.cell===r+'||'+c))))return alert('No se puede eliminar una celda que contiene muestras.');g.rowTitle=d.rowTitle;g.colTitle=d.colTitle;g.rows=rows;g.cols=cols;ensureQuotaSlots(g);refresh()}
function saveQuotaTargets(id,f){let g=db.sampleGroups.find(x=>x.id===id);g.targets??={};for(let [k,v]of new FormData(f))g.targets[k]=Math.max(0,Math.floor(num(v)));ensureQuotaSlots(g);sub.samplePage="seguimiento";refresh()}
function saveSampleEntry(f){let g=db.sampleGroups.find(x=>x.id===(sub.sampleGroup||db.sampleGroups[0]?.id)),d=formData(f),old=target('samples');if(!g)return;let cell=d.cell||'',category=d.category||'';let code='';if(g.kind==='cuotas'){ensureQuotaSlots(g);let slot=g.slots.find(x=>x.code===(d.slotCode||sub.sampleSlot));if(!slot)return alert('Seleccione un código reservado en la tabla.');code=slot.code;if(!slot.extra)cell=slot.cell;else{if(!cell)return alert('Indique la cuota de la muestra excedente.');slot.cell=cell}old=db.samples.find(s=>s.groupId===g.id&&s.code===code)||null;}let item={name:d.name,groupId:g.id,cell,category,altCodes:jsonList(d.altText),urls:jsonList(d.urlsText),notes:d.notes};if(old){Object.assign(old,item)}else{if(g.kind!=='cuotas'){code=(g.prefix||'MUE')+'-'+String(g.nextNumber||1).padStart(3,'0');while(db.samples.some(s=>s.code===code)){g.nextNumber++;code=(g.prefix||'MUE')+'-'+String(g.nextNumber).padStart(3,'0')}g.nextNumber++}db.samples.push({id:uid(),code,type:g.kind==='cuotas'?'Por cuotas':'Lista de datos',...item,checks:{},tasks:[]})}editing=null;sub.sampleSlot='';refresh()}

function saveSample(f){let x=target('samples');upsert('samples',f,d=>({code:d.code,name:d.name,type:d.type,quota:d.quota,quotaTarget:num(d.quotaTarget),variables:jsonList(d.variablesText),altCodes:jsonList(d.altText),urls:jsonList(d.urlsText),notes:d.notes,checks:x?.checks||{},tasks:x?.tasks||[]}))}function sampleReady(s){return db.sampleCheck.every(c=>s.checks?.[c])&&(s.tasks||[]).every(t=>t.done)}function checkSample(id,key,val){let s=db.samples.find(x=>x.id===id);(s.checks||={})[decodeURIComponent(key)]=val;refresh()}function addSampleTask(id,f){let s=db.samples.find(x=>x.id===id);(s.tasks||=[]).push({id:uid(),description:inp('description',f),done:false});refresh()}function sampleTask(id,tid){let t=db.samples.find(x=>x.id===id).tasks.find(t=>t.id===tid);t.done=!t.done;refresh()}function sampleQuotas(){let q={};db.samples.filter(s=>s.type==='Por cuotas').forEach(s=>{let k=s.quota||'Sin cuota';q[k]??={count:0,target:0};q[k].count++;q[k].target=Math.max(q[k].target,s.quotaTarget||0)});return `<div class="card"><h3>Avance por cuotas</h3>${Object.entries(q).map(([name,v])=>`<p><b>${esc(name)}</b>: ${v.count} registros / objetivo ${v.target||'no definido'}</p><div class="bar"><div style="width:${v.target?Math.min(100,100*v.count/v.target):0}%"></div></div>`).join('')||empty('Sin cuotas registradas.')}</div>`}
let productWizard=null;
const productTypes=['Artículo','Libro','Capítulo','Ponencia','Tesis'];
const productStages={Artículo:['En escritura','Enviado','Aceptado','Publicado'],Libro:['En escritura','Enviado','Aceptado','Publicado'],Capítulo:['En escritura','Enviado','Aceptado','Publicado'],Ponencia:['Aceptado','Realizada'],Tesis:['Registrada']};
function prodStage(p){return p.stage||({'Manuscrito':'En escritura','En evaluación':'Enviado','En prensa':'Aceptado','Publicado':'Publicado'}[p.status])||(p.type==='Ponencia'?(p.realized?'Realizada':'Aceptado'):(p.published?'Publicado':p.accepted?'Aceptado':p.sent?'Enviado':'En escritura'));}
function productEvidenceLabel(p){if(p.type==='Tesis')return 'Enlace de tesis';let stage=prodStage(p);return stage==='En escritura'?'':stage==='Enviado'?'Constancia de envío':stage==='Aceptado'?'Constancia de aceptación':stage==='Realizada'?'Constancia de ponencia realizada':stage==='Publicado'?(p.type==='Artículo'?'PDF del artículo':p.type==='Libro'?'PDF del libro':'PDF del capítulo'):'';}
function productGoalIds(p){return [...new Set([...(Array.isArray(p.goals)?p.goals:[]),...(p.goal?[p.goal]:[])].filter(Boolean))]}
function productPersonRole(p,person){if(p.type==='Tesis'){let roles=(p.supervisors||[]).filter(r=>r.id===person.id).map(r=>r.role);if(roles.length)return roles.join(', ');if((p.authors||[]).some(a=>a.trim().toLowerCase()===person.name.trim().toLowerCase()))return 'Autor/a';return '';}return (p.memberIds||[]).includes(person.id)||(p.authors||[]).some(a=>a.trim().toLowerCase()===person.name.trim().toLowerCase())?'Autor/a':''}
function objectiveCoverage(ps){let groups=db.project.goals.flatMap((g,i)=>(g.specific||[]).map((o,j)=>({o,g,ref:`${i+1}.${j+1}`,products:ps.filter(p=>productGoalIds(p).includes(o.id))})));let max=Math.max(1,...groups.map(x=>x.products.length));return `<div class="card"><h3>Cobertura de objetivos específicos</h3><p class="muted">Cada producto se muestra en todos sus objetivos asociados. Las barras representan cantidad de productos, no porcentaje de cumplimiento del objetivo.</p><div class="grid">${groups.map(x=>`<div class="record" style="margin:0"><div class="row"><b>OE ${x.ref}</b><span class="right chip ${x.products.length?'good':'warn'}">${x.products.length} producto${x.products.length===1?'':'s'}</span></div><p>${esc(x.o.title)}</p><div class="bar"><div style="width:${100*x.products.length/max}%;background:${x.products.length?'#298c71':'#dca64c'}"></div></div>${x.products.map(p=>`<div class="subtle"><span class="chip">${esc(p.type)}</span> <b>${esc(p.title)}</b><div class="row"><span class="muted">${esc(prodStage(p))}</span>${btn('Ver / editar',`beginProductWizard('${p.id}')`,'small')}</div></div>`).join('')||'<p class="muted">Sin productos vinculados todavía.</p>'}</div>`).join('')||empty('Configure los objetivos específicos en el módulo Proyecto para consultar su cobertura.')}</div></div><div class="card"><h3>Productos sin objetivos asociados</h3>${ps.filter(p=>!productGoalIds(p).length).map(p=>`<div class="record row"><b>${esc(p.title)}</b><span class="right"></span>${btn('Asociar objetivos',`beginProductWizard('${p.id}')`,'small')}</div>`).join('')||'<p class="muted">Todos los productos de esta selección tienen al menos un objetivo vinculado.</p>'}</div>`}
function productsView(){let year=sub.productYear||'todos',view=sub.productView||'objetivos';let ps=db.products.filter(p=>year==='todos'||productYear(p)===year);return moduleTop('Productos','Registro y seguimiento de producción académica y cobertura de objetivos específicos.')+`<div class="selector-cards"><button class="${view==='objetivos'?'active':''}" onclick="sub.productView='objetivos';render()">Cobertura por objetivos</button><button class="${view==='lista'?'active':''}" onclick="sub.productView='lista';render()">Todos los productos</button><button onclick="beginProductWizard()">＋ Registrar producto</button></div><div class="card"><div class="row"><b>${ps.length} productos en la selección</b><span class="right"></span><label>Año <select onchange="sub.productYear=this.value;render()"><option value="todos">Todos</option>${db.project.years.map(y=>`<option value="${y.id}" ${year===y.id?'selected':''}>${esc(y.name)}</option>`).join('')}</select></label></div></div>${view==='objetivos'?objectiveCoverage(ps):`<div class="card"><h3>Productos registrados</h3>${ps.map(productCard).join('')||empty('No hay productos registrados para este período.')}</div>`}`}
function productYear(p){let v=p.stageDate||p.published||p.realized||p.accepted||p.sent||p.date||'';return yearOf(v.length===7?v+'-01':v)}
function productCard(p){let label=productEvidenceLabel(p),e=p.evidence?.[label];return `<div class="record"><div class="record-head"><div><span class="chip">${esc(p.type)}</span><span class="chip">${esc(prodStage(p))}</span><span class="chip">${esc(yn(productYear(p)))}</span><h4>${esc(p.title)}</h4><p>${esc((p.authors||[]).join(' · '))}</p><p class="muted">${esc(p.journal||p.publisher||p.venue||'')} · ${esc(p.stageDate||'Fecha sin registrar')}</p>${label?`<p><code>${esc(productDocCode(p,label))}</code> · ${esc(label)} · ${link(e?.url,'Abrir evidencia')} <span class="chip ${e?.url?'good':'warn'}">${e?.url?'Disponible':'Pendiente'}</span></p>`:'<span class="chip">Sin evidencia exigida</span>'}</div><div class="actions"><button class="btn" onclick="beginProductWizard('${p.id}')">Editar / actualizar</button>${btn('Eliminar',`erase('products','${p.id}')`,'small danger')}</div></div></div>`}
function beginProductWizard(id=''){let p=db.products.find(x=>x.id===id);productWizard={id,type:p?.type||'',authors:p?.authors?.slice()||[],stage:p?prodStage(p):'',draft:p||null};showProductTypeStep()}
function closeProductWizard(){productWizard=null;document.getElementById('entryDialog')?.remove()}
function chooseProductType(type){if(!productWizard)return;productWizard.type=type;if(!productWizard.stage||!productStages[type]?.includes(productWizard.stage))productWizard.stage=productStages[type][0];showProductDetailStep()}
function showProductTypeStep(){let w=productWizard;if(!w)return;wizardShellProduct('Registrar producto · Paso 1 de 2',`<p>Selecciona el tipo de producto.</p><div class="selector-cards">${productTypes.map(t=>`<button class="${w.type===t?'active':''}" onclick="chooseProductType('${t}')">${t}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="closeProductWizard()">Cancelar</button></div>`)}
function wizardShellProduct(title,html){document.getElementById('entryDialog')?.remove();let overlay=document.createElement('div');overlay.className='project-overlay';overlay.id='entryDialog';overlay.innerHTML=`<div class="project-dialog entry-dialog" style="width:min(850px,100%)"><div class="row" style="justify-content:space-between"><h2>${esc(title)}</h2><button class="btn" onclick="closeProductWizard()">Cerrar ×</button></div>${html}</div>`;document.body.appendChild(overlay)}
function snapshotProductForm(){let f=document.getElementById('productDetailsForm');if(f)productWizard.cached={...productWizard.cached,...Object.fromEntries(new FormData(f)),goals:[...f.querySelectorAll('[name=productGoal]:checked')].map(x=>x.value)}}function addWizardAuthor(){let f=document.getElementById('productDetailsForm');let n=f?.elements.namedItem('newAuthor')?.value.trim();if(!n)return;snapshotProductForm();productWizard.authors.push(n);showProductDetailStep();}
function addTeamProductAuthor(id){let t=db.team.find(x=>x.id===id);if(t&&!productWizard.authors.includes(t.name)){snapshotProductForm();productWizard.authors.push(t.name);showProductDetailStep()}}
function removeWizardAuthor(i){snapshotProductForm();productWizard.authors.splice(i,1);showProductDetailStep()}
function moveWizardAuthor(i,d){snapshotProductForm();let a=productWizard.authors,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];showProductDetailStep()}

function resolveLinkedProductEvidence(linkage){
 if(!linkage||!linkage.mode)return {code:'',name:'',url:'',done:false};
 if(linkage.mode==='external')return {code:(linkage.code||'').trim(),name:linkage.name||'Documento de producto externo',url:(linkage.url||'').trim(),done:!!(linkage.code||'').trim()&&!!(linkage.url||'').trim()};
 let p=db.products.find(x=>x.id===linkage.productId);
 if(!p)return {code:'',name:'Producto no encontrado',url:'',done:false};
 let key=linkage.documentKey;
 if(!key)return {code:'',name:p.title,url:'',done:false};
 let v=p.evidence?.[key]||{};
 return {code:productDocCode(p,key),name:p.title+' · '+key,url:v.url||'',done:!!v.url&&v.done!==false};
}

function wizardDocCode(g,subId,expenseId,typeId,docIndex){let type=db.expenseTypes.find(t=>t.id===typeId),e=g.expenses?.find(x=>x.id===expenseId);if(e&&e.subItemId===subId&&e.typeId===typeId)return expenseDocCode(g,e,type?.docs[docIndex]||'');let tmp={id:'temp',subItemId:subId,typeId,docs:{}};let ordered=[...(g.expenses||[])];if(e)ordered=ordered.filter(x=>x.id!==e.id);ordered.push(tmp);let original=g.expenses;g.expenses=ordered;let code=expenseDocCode(g,tmp,type?.docs[docIndex]||'');g.expenses=original;return code;}
function showExpenseWizardStep2(){let w=expenseWizard;if(!w)return;quotaRowCounter=0;extraEvidenceCount=0;let g=db.budget.find(x=>x.id===w.glosa),type=db.expenseTypes.find(t=>t.id===w.typeId);if(!g||!type||(g.subitems.length&&!w.subitem))return showExpenseWizardStep1();let old=w.draft;let available=assignedSubitem(g,w.subitem)-committedSubitem(g,w.subitem,w.expenseId);
 const evidence=(type.docs||[]).map((name,i)=>{let olddoc=old?.docs?.[name]||{},code=wizardDocCode(g,w.subitem,w.expenseId,w.typeId,i);return `<div class="record"><div class="row"><b>${esc(name)}</b><code class="chip">${esc(code)}</code><button type="button" class="btn small" onclick="wizardCopyCode('${code}')">Copiar código</button></div><label class="field"><span>Enlace al documento</span><input type="url" name="ev_${i}" placeholder="https://..." value="${esc(olddoc.url||'')}"></label><label class="row"><input type="checkbox" name="ok_${i}" ${olddoc.done?'checked':''}> Documento listo</label></div>`}).join('');
 wizardShell(w.expenseId?'Editar gasto · Paso 2 de 2':'Registrar gasto · Paso 2 de 2',`<p class="muted"><b>${esc(g.name)}</b> · ${esc(g.subitems.find(x=>x.id===w.subitem)?.name||'Sin subítem')} · ${esc(type.name)}</p><span class="chip ${available<0?'bad':'good'}">Saldo antes de registrar: ${fmt(available)}</span><p class="smallhelp">Puedes registrar un gasto aunque el saldo sea cero o negativo. El saldo resultante quedará destacado en rojo para orientar los ajustes presupuestarios.</p><form id="wizardExpenseForm" onsubmit="event.preventDefault();saveWizardExpense(this)"><div class="grid">${field('Descripción del gasto','title',old?.title||'')}${field('Monto (CLP)','amount',old?.amount||0,'number')}${field('Situación','paid',String(old?.paid??false),'select',[['false','Proyectado'],['true','Efectivo']])}</div><div class="record"><h3>Modalidad de pago</h3><div class="selector-cards"><button type="button" onclick="toggleQuotaMode(false)">Pago único</button><button type="button" onclick="toggleQuotaMode(true)">Gasto por cuotas</button></div><div id="quotaRows" style="display:${old?.installments?.length?'block':'none'}"><p class="muted">Registra cada cuota y marca individualmente si fue pagada o sigue proyectada. La suma debe coincidir con el monto total.</p><div id="quotaEntries">${(old?.installments||[]).map((t,i)=>quotaRowHtml(i,t)).join('')}</div><button type="button" class="btn" onclick="addQuotaRow()">＋ Agregar cuota</button></div></div>${field('Observaciones','note',old?.note||'','textarea')}<div class="record"><label class="row" style="cursor:pointer"><input type="checkbox" name="internationalPurchase" ${old?.internationalPurchase?'checked':''} onchange="toggleInternationalEvidence(this.checked)"><b>Compra internacional</b></label><p class="smallhelp">Si marcas esta opción, se exigirá el documento de cambio a pesos chilenos (CLP).</p></div><h3>Documentos de evidencia</h3><p class="muted">El código corresponde al nombre que debes asignar al archivo. Puedes completar los enlaces posteriormente.</p>${evidence||empty('Este tipo de gasto no tiene evidencias configuradas.')}<div id="internationalEvidence" style="display:${old?.internationalPurchase?'block':'none'}" class="record"><div class="row"><b>Documento cambio a CLP</b><code class="chip">${esc(wizardInternationalCode(g,w))}</code><button type="button" class="btn small" onclick="wizardCopyCode(wizardInternationalCode(db.budget.find(x=>x.id===expenseWizard.glosa),expenseWizard))">Copiar código</button></div><label class="field"><span>Enlace al documento</span><input type="url" name="internationalUrl" placeholder="https://..." value="${esc(old?.docs?.['Documento cambio a CLP']?.url||'')}"></label><label class="row"><input type="checkbox" name="internationalDone" ${old?.docs?.['Documento cambio a CLP']?.done?'checked':''}> Documento listo</label></div> ${type.requiresProductEvidence?linkedProductEvidenceHtml(old?.productEvidence):''}<h3>Documentos adicionales del mismo tipo</h3><p class="muted">Por ejemplo, una segunda boleta de honorarios del mismo gasto. No se generan cuotas independientes de evidencias.</p>${(old?.extraDocuments||[]).map((ev,i)=>`<div class="record"><b>${esc(ev.name)}</b><code class="chip">${esc(wizardExtraCode(g,w, i))}</code><button type="button" class="btn small" onclick="wizardCopyCode('${wizardExtraCode(g,w,i)}')">Copiar código</button>${field('Enlace','extraUrl_'+i,ev.url||'','url')}</div>`).join('')}<div id="additionalEvidence"></div><button type="button" class="btn" onclick="addExpenseEvidenceRow()">＋ Agregar otro documento</button>${field('Otros anexos (una URL por línea)','extrasText',old?.extras?.join('\n')||'','textarea')}<div class="actions"><button type="submit" class="btn primary">Guardar gasto</button><button type="button" class="btn" onclick="showExpenseWizardStep1()">← Volver</button></div></form>`);
}
let quotaRowCounter=0;
function quotaRowHtml(i,t={}){return `<div class="record row quota-entry"><label class="field"><span>Fecha</span><input type="date" name="quotaDate_${i}" value="${esc(t.date||'')}"></label><label class="field"><span>Monto CLP</span><input type="number" min="0" name="quotaAmount_${i}" value="${esc(t.amount??0)}"></label><label class="field"><span>Estado</span><select name="quotaPaid_${i}"><option value="false" ${t.paid?'':'selected'}>Proyectada</option><option value="true" ${t.paid?'selected':''}>Pagada</option></select></label><button type="button" class="btn small danger" onclick="this.closest('.quota-entry').remove()">Quitar</button></div>`}
function toggleQuotaMode(on){let wrap=document.getElementById('quotaRows');if(!wrap)return;wrap.style.display=on?'block':'none';if(on&&!wrap.querySelector('.quota-entry'))addQuotaRow()}
function addQuotaRow(){let container=document.getElementById('quotaEntries');if(!container)return;let i=++quotaRowCounter+100;container.insertAdjacentHTML('beforeend',quotaRowHtml(i))}
function readWizardQuotas(form){let wrap=form.querySelector('#quotaRows');if(!wrap||wrap.style.display==='none')return [];return [...form.querySelectorAll('.quota-entry')].map(row=>({date:row.querySelector('[name^="quotaDate_"]').value,amount:Number(row.querySelector('[name^="quotaAmount_"]').value||0),paid:row.querySelector('[name^="quotaPaid_"]').value==='true'}))}
let extraEvidenceCount=0;
function toggleInternationalEvidence(on){let el=document.getElementById('internationalEvidence');if(el)el.style.display=on?'block':'none'}
function wizardInternationalCode(g,w){let t=db.expenseTypes.find(x=>x.id===w.typeId);let prefix=wizardDocCode(g,w.subitem,w.expenseId,w.typeId,0).slice(0,-2);return prefix+pad2((t?.docs||[]).length+1)}
function wizardExtraCode(g,w,i){let e=g.expenses?.find(x=>x.id===w.expenseId)||{id:'temp',subItemId:w.subitem,typeId:w.typeId,docs:{}};let prefix=wizardDocCode(g,w.subitem,w.expenseId,w.typeId,0).slice(0,-2);let base=(db.expenseTypes.find(t=>t.id===w.typeId)?.docs||[]).length;return prefix+pad2(base+(expenseWizard?.draft?.internationalPurchase?1:0)+i+1)}
function addExpenseEvidenceRow(){let node=document.getElementById('additionalEvidence');if(!node)return;let i=extraEvidenceCount++;let type=db.expenseTypes.find(t=>t.id===expenseWizard.typeId),g=db.budget.find(x=>x.id===expenseWizard.glosa);let div=document.createElement('div');div.className='record';div.innerHTML=`<label class="field"><span>Tipo de documento</span><select name="extraName_${i}">${(type?.docs||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><p>Código: <code>${wizardExtraCode(g,expenseWizard,(expenseWizard.draft?.extraDocuments||[]).length+i)}</code></p><label class="field"><span>Enlace al documento</span><input type="url" name="extraUrlNew_${i}" placeholder="https://..."></label>`;node.appendChild(div)}
function saveWizardExpense(form){let w=expenseWizard;if(!w)return;let g=db.budget.find(x=>x.id===w.glosa),type=db.expenseTypes.find(t=>t.id===w.typeId),old=(g.expenses||[]).find(x=>x.id===w.expenseId);if(!g||!type)return alert('Selección inválida.');let d=formData(form);if(!d.title?.trim())return alert('Indica una descripción del gasto.');let amount=Number(d.amount);if(!Number.isFinite(amount)||amount<0)return alert('Ingresa un monto válido.');let installments=readWizardQuotas(form);if(installments.some(t=>!t.date||!Number.isFinite(t.amount)||t.amount<=0))return alert('Completa fecha y monto positivo de cada cuota.');if(installments.length&&Math.abs(installments.reduce((a,t)=>a+num(t.amount),0)-amount)>0.01)return alert('La suma de las cuotas debe coincidir con el monto total del gasto.');let requested=amount;let available=assignedSubitem(g,w.subitem)-committedSubitem(g,w.subitem,w.expenseId);/* Se permite el sobregasto. */let docs={...(old?.docs||{})};let internationalPurchase=!!form.elements.namedItem('internationalPurchase')?.checked;if(internationalPurchase){docs['Documento cambio a CLP']={url:inp('internationalUrl',form).trim(),done:!!form.elements.namedItem('internationalDone')?.checked}}else delete docs['Documento cambio a CLP'];(type.docs||[]).forEach((name,i)=>{let url=inp('ev_'+i,form).trim();docs[name]={url,done:!!form.elements.namedItem('ok_'+i)?.checked}});let extraDocuments=[...(old?.extraDocuments||[]).map((x,i)=>({...x,url:inp('extraUrl_'+i,form)||x.url}))];for(let i=0;i<extraEvidenceCount;i++){let name=inp('extraName_'+i,form),url=inp('extraUrlNew_'+i,form);if(name)extraDocuments.push({name,url,done:!!url})}extraEvidenceCount=0;let productEvidence=type.requiresProductEvidence?readLinkedProductEvidence(form,old?.productEvidence):null;let data={internationalPurchase,productEvidence,extraDocuments,title:d.title.trim(),amount,typeId:type.id,typeName:type.name,subItemId:w.subitem,paid:d.paid==='true',installments,note:d.note,docs,extras:jsonList(d.extrasText)};if(old)Object.assign(old,data);else(g.expenses??=[]).push({id:uid(),...data});closeExpenseWizard();refresh();}
function wizardCopyCode(code){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(code).catch(()=>prompt('Copia este código:',code));else prompt('Copia este código:',code)}

</script></body></html>
